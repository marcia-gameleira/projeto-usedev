<header>
  <div class="container">
    <img src="images/logo.svg" alt="Logo UseDev">
    <div class="cart">
      <img src="images/shopping_cart.svg" alt="Ícone carrinho de compra">
      @if (totalCartItens() > 0) {
        <span class="badge">{{ totalCartItens() }}</span>
      }
    </div>
  </div>
</header>

<img src="images/banner.png" class="banner" alt="Imagem banner">

<main>
  <div class="container">
    <h2>Promos Especiais</h2>
    <div class="product-list">
      @for (product of products(); track product.id) {
        <div class="product-card" (click)="addToCart()">
          <img class="product-img" [src]="product.imageUrl" alt="Foto do produto camiseta capy">
          <div class="product-info">
            <div class="product-name">{{ product.name }}</div>
            <div class="product-price">R$ {{ product.price }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <img src="images/logo-green.svg" alt="Logo UseDev">
    <div class="slogan">Hora de abraçar seu lado Geek com a Márcia</div>
  </div>
</footer>
